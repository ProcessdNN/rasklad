name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: Compress-Archive target/release/capswitch.exe "capswitch-${{ github.ref_name }}-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/capswitch.exe
            capswitch-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
