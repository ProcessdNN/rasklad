name: Bug report
description: Something does not work the way it should
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the fields below. Most reports cannot be reproduced
        without the Windows version and the hotkey you are using.

        For questions use Discussions instead of an issue.
  - type: input
    id: version
    attributes:
      label: Rasklad version
      description: The release tag you downloaded, or the name of the exe file.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Windows 8.1 or older
        - Windows Server
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Windows build number
      description: "Run `winver` and paste the number from the window."
      placeholder: "22631.4317"
  - type: dropdown
    id: admin
    attributes:
      label: Is rasklad running as administrator?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: hotkey
    attributes:
      label: Hotkey and Caps Lock combo
      description: What the settings window shows. Defaults are Caps Lock and Win+Caps.
      placeholder: "Caps Lock, Win+Caps"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it fail?
      description: Pick everything that applies. These are different problems.
      multiple: true
      options:
        - In every application
        - Only in some applications
        - Only while the rasklad window is focused
        - Only in applications running as administrator
        - Only after some time, not right away
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you press, in which application, and what happens instead.
      placeholder: |
        1. Open Notepad
        2. Press Caps Lock
        3. The layout does not change
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log (optional)
      description: |
        If the problem can be reproduced on demand, a log helps. Start rasklad
        from a command prompt with logging enabled, reproduce the problem, then
        attach the file:

        ```
        set RASKLAD_LOG=%LOCALAPPDATA%\rasklad-debug.log
        rasklad.exe
        ```

        The file contains key codes and decisions only. It never contains text
        you typed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find this problem
          required: true
        - label: I am using the latest release
          required: true
